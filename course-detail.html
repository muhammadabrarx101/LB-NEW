<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redirecting - Learning Bubble</title>
    <meta name="robots" content="noindex,follow">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css">

    <!--
      Legacy URL. Every course now has its own static page at
      /course-<slug>, which is what Google indexes. This exists only so
      old links and bookmarks of the form ?id=N still land correctly.
    -->
    <script src="courses-data.js"></script>
    <script>
        (function () {
            var id = new URLSearchParams(location.search).get('id');
            var c = (typeof LB !== 'undefined' && id) ? LB.course(id) : null;
            location.replace(c && c.slug ? 'course-' + c.slug : 'courses?branch=kids');
        })();
    </script>
</head>

<body>
    <div class="container section">
        <p class="result-line">Redirecting to the course page...</p>
        <p><a href="courses?branch=kids">Browse kids courses</a> &middot;
            <a href="courses?branch=academics">Browse academics programmes</a></p>
    </div>
</body>

</html>
