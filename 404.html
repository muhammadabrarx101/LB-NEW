<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="/styles.css">

    <script>
        (function () {
            try { if (localStorage.getItem('lb-theme') === 'dark') document.documentElement.classList.add('dark-theme'); }
            catch (e) { }
        })();
    </script>
