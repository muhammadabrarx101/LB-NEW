<!DOCTYPE html>
<html lang="en" data-branch="kids">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Course — Learning Bubble</title>
    <meta name="description" content="Course details, structure and outcomes at Learning Bubble.">
    <meta property="og:type" content="article">

    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="styles.css">

    <script>
        (function () {
            var d = document.documentElement;
            try {
                if (localStorage.getItem('lb-theme') === 'dark') d.classList.add('dark-theme');
                d.setAttribute('data-branch', localStorage.getItem('lb-branch') || 'kids');
            } catch (e) { d.setAttribute('data-branch', 'kids'); }
        })();
    </script>

    <script defer src="courses-data.js"></script>
    <script defer src="script.js"></script>
    <script defer src="course-detail.js"></script>
</head>

<body>

    <header class="site-header" id="siteHeader">
        <div class="container nav-inner">
            <a class="brand" href="kids.html" data-branch-home>
                <img class="brand-logo" src="assets/images/logo.png" alt="Learning Bubble" width="40" height="40">
                <span class="brand-text"><strong>Learning Bubble</strong><em class="brand-sub"
                        id="brandSub">Course</em></span>
            </a>

            <nav class="nav-links" id="navLinks" aria-label="Main">
                <a class="nav-link" href="kids.html" data-branch-home>Home</a>
                <a class="nav-link" href="courses.html" data-branch-courses>Courses</a>
                <a class="nav-link" href="about.html">About</a>
                <a class="nav-link" href="resources.html">Resources</a>
                <a class="nav-link" href="contact.html">Contact</a>
            </nav>

            <div class="nav-actions">
                <div class="branch-switch" role="group" aria-label="Choose programme">
                    <a href="kids.html" data-branch="kids"><i class="fas fa-rocket"></i><span>Kids</span></a>
                    <a href="academics.html" data-branch="academics"><i
                            class="fas fa-graduation-cap"></i><span>Academics</span></a>
                </div>
                <button class="icon-btn" data-search-open aria-label="Search courses" title="Search (Ctrl+K)">
                    <i class="fas fa-magnifying-glass" aria-hidden="true"></i>
                </button>
                <button class="icon-btn" id="themeToggle" aria-label="Toggle dark mode"></button>
                <a class="btn btn-primary btn-sm" href="enrollment.html">Enquire</a>
                <button class="nav-toggle" id="navToggle" aria-label="Menu" aria-expanded="false"
                    aria-controls="navLinks"><span></span><span></span><span></span></button>
            </div>
        </div>
    </header>

    <main id="courseDetail">
        <div class="container section">
            <p class="result-line"><i class="fas fa-spinner fa-spin"></i> Loading course…</p>
        </div>
    </main>

    <footer class="site-footer" id="siteFooter"></footer>
</body>

</html>
